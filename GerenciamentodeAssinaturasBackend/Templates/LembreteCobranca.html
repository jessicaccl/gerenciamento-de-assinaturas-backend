<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f3ff;
            padding: 20px;
            color: #1f1f2e;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(76, 29, 149, 0.12);
        }

        .header {
            background: linear-gradient(135deg, #6d28d9 0%, #10b981 100%);
            color: white;
            padding: 22px 30px;
        }

        .header .marca {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
        }

        .content {
            padding: 30px;
            font-size: 16px;
            line-height: 1.6;
        }

        .resumo {
            background: #f5f3ff;
            border-radius: 8px;
            padding: 16px 20px;
            margin: 20px 0;
        }

        .resumo td {
            padding: 4px 0;
        }

        .resumo .rotulo {
            color: #6b6b80;
            padding-right: 24px;
        }

        .btn {
            display: inline-block;
            background-color: #6d28d9;
            color: white !important;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .footer {
            padding: 20px 30px 30px;
            font-size: 12px;
            color: #888;
            text-align: center;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p class="marca">Assina+</p>
        </div>

        <div class="content">
            <h2 style="margin-top: 0;">{{TITULO}}</h2>
            <p>Olá, <strong>{{NOME}}</strong>!</p>
            <p>{{MENSAGEM}}</p>

            <div class="resumo">
                <table>
                    <tr><td class="rotulo">Plano</td><td><strong>{{PLANO}}</strong></td></tr>
                    <tr><td class="rotulo">Valor</td><td><strong>{{VALOR}}</strong></td></tr>
                    <tr><td class="rotulo">Vencimento</td><td><strong>{{VENCIMENTO}}</strong></td></tr>
                </table>
            </div>

            <div style="text-align: center;">
                <a href="{{URL_SISTEMA}}" class="btn">ACESSAR O ASSINA+</a>
            </div>
        </div>

        <div class="footer">
            <p>Este é um e-mail automático, não é necessário respondê-lo.</p>
            <p>Assina+ &middot; projeto de portfólio</p>
        </div>
    </div>
</body>
</html>
